name: scalrise-ai

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: scalrise-ollama
    restart: unless-stopped

    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
      - "${TAILSCALE_IP}:11434:11434"

    volumes:
      - ollama-data:/root/.ollama

    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_NO_CLOUD: "1"

    # Plafond réduit pour laisser de la marge à l'hôte (OS + OpenWebUI) sur le VPS-3 OVH (12 Go RAM).
    mem_limit: 8g

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  init:
    image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
    container_name: scalrise-init
    depends_on:
      ollama:
        condition: service_healthy

    working_dir: /app

    volumes:
      - ./:/app

    environment:
      # Le nom du service Docker remplace localhost : les conteneurs ne partagent pas le réseau de l'hôte.
      OLLAMA_URL: http://ollama:11434

    entrypoint: ["pwsh", "-NoProfile", "-File", "/app/scripts/init-scalia.ps1"]
    restart: "no"

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: scalrise-openwebui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy

    ports:
      - "127.0.0.1:${OPENWEBUI_PORT:-3000}:8080"

    volumes:
      - openwebui-data:/app/backend/data

    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Désactive la création de compte : accès direct sans inscription.
      WEBUI_AUTH: "false"

volumes:
  ollama-data:
    name: scalrise-ollama-data
  openwebui-data:
    name: scalrise-openwebui-data
